name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes automatically in GitHub's cloud (24/7)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL || 'https://aarav-portfolio-backend.onrender.com' }}"
          echo "Pinging backend at: $BACKEND_URL"
          
          # Allow up to 60s timeout in case Render is waking from sleep
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BACKEND_URL/")
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Backend is active and awake!"
          else
            echo "Ping attempted. Response code: $HTTP_STATUS"
          fi
